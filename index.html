<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio | Otávio</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap">

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/header.css">
    <link rel="stylesheet" href="assets/css/acordeon.css">
    <link rel="stylesheet" href="assets/css/languages.css">
    <link rel="stylesheet" href="assets/css/portfolio.css">
    <link rel="stylesheet" href="assets/css/experience.css">
    <link rel="stylesheet" href="assets/css/skills.css">
    <link rel="stylesheet" href="assets/css/footer.css">
</head>

<body>
    <main class="main">
        <header class="header">
            <img src="assets/image/Otavio.jpeg" alt="Foto de Perfil" class="photo" id="profile.photo">

            <h1 class="title">
                Olá, <br>eu sou o <span id="profile.name">Otávio</span>
            </h1>

            <div class="information">
                <p class="job" id="profile.job">Estudante de ADS</p>
                <p class="location" id="profile.location">Patos PB - BR</p>
                <p class="phone">
                    <a href="tel:8398135312" id="profile.phone">(83) 9 813-5312</a>
                </p>
                <p class="email">
                    <a href="mailto:otaviocarmo21@gmail.com" id="profile.email">otaviocarmo21@gmail.com</a>
                </p>
            </div>
        </header>

        <!-- Acordeão: Skills -->
        <section class="acordeon">
            <button class="trigger" type="button">
                <h2>Skills</h2>
            </button>
            <div class="content">
                <div class="skills">
                    <section class="tools">
                        <h3>Ferramentas:</h3>
                        <ul id="profile.skills.hardSkills"></ul>
                    </section>
                    <section class="personal">
                        <h3>Habilidades Pessoais:</h3>
                        <ul id="profile.skills.softSkills"></ul>
                    </section>
                </div>
            </div>
        </section>

        <!-- Acordeão: Idiomas -->
        <section class="acordeon">
            <button class="trigger" type="button">
                <h2>Idiomas</h2>
            </button>
            <div class="content">
                <ul class="languages" id="profile.languages"></ul>
            </div>
        </section>

        <!-- Acordeão: Educação (Com conquistas e graduação como no 2º print) -->
        <section class="acordeon">
            <button class="trigger" type="button">
                <h2>Educação</h2>
            </button>
            <div class="content">
                <div class="education-container">
                    <p class="subtitle">Em Aprendizado:</p>
                    <ul class="learning-icons" id="profile.skills.learning"></ul>
                    <ul class="experience" id="profile.education"></ul>
                </div>
            </div>
        </section>

        <!-- Acordeão: Portfólio -->
        <section class="acordeon">
            <button class="trigger" type="button">
                <h2>Portfólio</h2>
            </button>
            <div class="content">
                <ul class="portfolio" id="profile.portfolio"></ul>
            </div>
        </section>

        <!-- Acordeão: Experiência Profissional -->
        <section class="acordeon">
            <button class="trigger" type="button">
                <h2>Experiência Profissional</h2>
            </button>
            <div class="content">
                <ul class="experience" id="profile.professionalExperience"></ul>
            </div>
        </section>

        <footer>
            <a href="https://github.com/Otavio0009" target="_blank" rel="noopener noreferrer">
                <img src="assets/image/Icons/iconmonstr-github-1 1.svg" alt="GitHub Otávio">
            </a>
        </footer>
    </main>

    <script src="assets/js/acordeon.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
